server:
  port: 8082
spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3308/product_db?createDatabaseIfNotExist=true
    username: app
    password: app
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka