services:
  mysql-user:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: user_db, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}
    ports: ["3307:3306"]
  mysql-product:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: product_db, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}
    ports: ["3308:3306"]
  mysql-order:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: order_db, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}
    ports: ["3309:3306"]
  mysql-payment:
    image: mysql:8.4
    environment: {MYSQL_DATABASE: payment_db, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}
    ports: ["3310:3306"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  service-discovery:
    build: ./service-discovery
    ports: ["8761:8761"]
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_URL: http://service-discovery:8761/eureka
      JWT_SECRET: change-me-to-a-very-long-secret-key-for-local-development-only
    depends_on: [service-discovery]
  user-service:
    build: ./user-service
    ports: ["8081:8081"]
    environment:
      MYSQL_HOST: mysql-user
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://service-discovery:8761/eureka
      JWT_SECRET: change-me-to-a-very-long-secret-key-for-local-development-only
    depends_on: [mysql-user,kafka,service-discovery]
  product-service:
    build: ./product-service
    ports: ["8082:8082"]
    environment:
      MYSQL_HOST: mysql-product
      EUREKA_URL: http://service-discovery:8761/eureka
    depends_on: [mysql-product,service-discovery]
  order-service:
    build: ./order-service
    ports: ["8083:8083"]
    environment:
      MYSQL_HOST: mysql-order
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://service-discovery:8761/eureka
    depends_on: [mysql-order,kafka,service-discovery,product-service]
  payment-service:
    build: ./payment-service
    ports: ["8084:8084"]
    environment:
      MYSQL_HOST: mysql-payment
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://service-discovery:8761/eureka
    depends_on: [mysql-payment,kafka,service-discovery]
  notification-service:
    build: ./notification-service
    ports: ["8085:8085"]
    environment:
      KAFKA_URL: kafka:9092
      EUREKA_URL: http://service-discovery:8761/eureka
    depends_on: [kafka,service-discovery]
